name: Windows build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned engine and app
        shell: powershell
        run: ./scripts/Build.ps1
      - name: Offline regression suite
        shell: powershell
        run: ./scripts/Test.ps1
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-test-results
          path: |
            build/test-results.xml
            build/test-results.txt
            build/test-output.log
            build/test-errors.log
            build/tested-build.json
            build/*-performance.txt
      - name: Package clean portable release
        shell: powershell
        run: ./scripts/Package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flac-downloader-windows-x64
          path: dist/*
